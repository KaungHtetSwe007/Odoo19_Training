<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Required Display</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #102a43; margin: 0; }
        .ica-page { max-width: 980px; margin: 0 auto; padding: 32px 20px 48px; }
        .ica-hero { width: 100%; max-height: 420px; object-fit: cover; border-radius: 18px; background: #001d33; }
        h1 { color: #003b5c; font-size: 2.2rem; margin: 30px 0 12px; }
        .ica-summary { color: #486581; font-size: 1.15rem; line-height: 1.7; }
        .ica-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 28px; }
        .ica-card { border: 1px solid #d9e2ec; border-radius: 12px; padding: 18px; background: #f8fbfd; }
        .ica-label { color: #627d98; display: block; font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
        .ica-value { display: block; font-weight: 650; margin-top: 7px; }
    </style>
</head>
<body>
    <main class="ica-page">
        <img class="ica-hero" src="banner.jpg" alt="Form Required Display">
        <h1>Form Required Display</h1>
        <p class="ica-summary">Improve required field visual feedback on forms.</p>
        <section class="ica-meta" aria-label="Module information">
            <div class="ica-card"><span class="ica-label">Version</span><span class="ica-value">19.0.1.0.0</span></div>
            <div class="ica-card"><span class="ica-label">Category</span><span class="ica-value">Technical</span></div>
            <div class="ica-card"><span class="ica-label">License</span><span class="ica-value">LGPL-3</span></div>
            <div class="ica-card"><span class="ica-label">Author</span><span class="ica-value">Agga, IdeaCode Academy</span></div>
        </section>
    </main>
</body>
</html>
